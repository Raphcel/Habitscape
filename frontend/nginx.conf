server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ─── API proxy ────────────────────────────────────────────────────────────
    # Forward /api/* and /uploads/* to the backend container.
    # "backend" is the Docker Compose service name (resolved via Docker DNS).
    location /api/ {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Support large file uploads (food images)
        client_max_body_size 10M;
    }

    location /uploads/ {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
    }

    # Swagger docs proxy (so /docs works from the frontend origin)
    location /docs {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
    }

    # Proxy /ml-api/ requests directly to the Railway ML API.
    # The trailing slash in proxy_pass strips "/ml-api" from the request path.
    location /ml-api/ {
        proxy_pass         https://habitscape-production.up.railway.app/;
        proxy_http_version 1.1;
        proxy_set_header   Host              habitscape-production.up.railway.app;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 10M;
    }

    # ─── SPA fallback ─────────────────────────────────────────────────────────
    # React Router: any path that doesn't match a file → serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Caching ──────────────────────────────────────────────────────────────
    # Cache hashed assets aggressively
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
}
